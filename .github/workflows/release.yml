name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release tag
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_TYPE==='tag' && !['v'+p.version,'v'+p.version+'-'+p.codename].includes(process.env.GITHUB_REF_NAME)) process.exit(1)"
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: node node_modules/playwright/cli.js install --only-shell chromium
      - run: npm run test:integration
      - run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: bars-helper-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256
          --verify-tag --draft --prerelease
          --title "Bars Helper $RELEASE_TAG"
          --notes-file docs/RELEASE-NOTES.md
