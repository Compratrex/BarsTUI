name: Build desktop releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to attach archives to (empty: build artifacts only)'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release tag
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_TYPE==='tag' && !['v'+p.version,'v'+p.version+'-'+p.codename].includes(process.env.GITHUB_REF_NAME)) process.exit(1)"
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: node node_modules/playwright/cli.js install --only-shell chromium
      - run: npm run test:integration
      - run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: bars-helper-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14

  release-assets:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach archives or create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EXISTING_RELEASE: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check *.sha256
          cd ..
          if [ -n "$EXISTING_RELEASE" ]; then
            gh release view "$RELEASE_TAG" >/dev/null
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            # Packaging-only fixes can ship without changing the release's application code.
            git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- \
              src docs README.md package.json package-lock.json \
              scripts/launch.mjs scripts/install-command.mjs scripts/windows-dpapi.ps1 \
              scripts/touch-id.swift 'Bars Helper.command' 'Bars Helper.cmd' \
              'Install bars.command' 'Install bars.cmd'
            gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 \
              --verify-tag --draft --prerelease \
              --title "Bars Helper $RELEASE_TAG" \
              --notes-file docs/RELEASE-NOTES.md
          fi
